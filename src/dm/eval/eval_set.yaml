# Eval 题集：覆盖 直查 / 多表 / 多步任务链 / 越界。
# grader:
#   numeric  - 用 truth_sql 从仓库算出数字，判断答案是否包含该数字
#   set      - 用 truth_sql 算出集合，判断答案是否包含全部元素
#   refusal  - 越界题：判断答案是否明确说明"无此数据"而非编造
#   llm_judge- 叙述/多步结论：用一次 LLM 判断主要结论是否与 expected 一致
- id: C1
  category: direct
  question: "物料 M0001 当前的即时库存总量是多少？"
  grader: numeric
  truth_sql: "SELECT SUM(qty) FROM inventory WHERE material_id='M0001'"

- id: C2
  category: direct
  question: "物料 M0001 的库存分布在哪些仓库？请给出仓库编码。"
  grader: set
  truth_sql: "SELECT DISTINCT warehouse_id FROM inventory WHERE material_id='M0001' ORDER BY 1"

- id: C3
  category: join
  question: "供应商 S001 有哪些处于『未完成』状态的采购单？请给出采购单号。"
  grader: set
  truth_sql: "SELECT DISTINCT po_id FROM purchase_order WHERE supplier_id='S001' AND status='未完成' ORDER BY 1"

- id: C4
  category: direct
  question: "数据仓库里一共有多少种物料（物料主数据条数）？"
  grader: numeric
  truth_sql: "SELECT COUNT(*) FROM material"

- id: C5
  category: multistep
  question: "销售订单 SO0001 现在的库存够不够发货？请逐个物料比对需求与现有库存并给出结论。"
  grader: llm_judge
  expected: "结论应为库存充足、可以发货：该订单唯一物料 M0046 需求 265，现有总库存 829，足够发货。"

- id: C6
  category: out_of_scope
  question: "M0001 这个物料明天的人员排班和产能安排够吗？"
  grader: refusal
  expected: "应明确说明数据平台中没有排班/产能数据，并且不编造。"

# C7：能否按时交货（需自主规划：需求 vs 在库 vs 按交货日前到货的在途采购）。
# 关键考点——M0050 在库仅 72 远不足净需求 350，但未完成采购 PO0010 的 380 件在交货日前到货，
# 只看在库会误判缺货，计入在途才能正确判定「可按时」。truth_facts 由仓库实时算出喂给评委。
- id: C7
  category: multistep
  question: "销售订单 SO0021 能否在交货日前按时交付？请说明你需要哪些数据、如何判断，并给出缺口与理由。"
  grader: llm_judge
  expected: "SO0021 两行均为物料 M0050，净需求合计约 350（283+67，已发 0）。现有在库 72 单独远不足，必须把未完成采购单 PO0010（M0050 在途 380，预计到货 2026-06-10）这类在途供给纳入判断。但该预计到货日相对今日 2026-06-25 已逾期约半个月、状态仍『未完成』，故能否按交期全额交付存在重大不确定性。合格回答须满足：①算出净需求约 350，并指出在库 72 单独不足；②主动发现并纳入在途采购 PO0010(380)；③结论体现『最终取决于这张已逾期的采购单能否如期到货』——无论表述为『计入在途名义可满足但有逾期风险』『不能保证按时/可能有缺口』还是『需跟催 PO0010 才能确定』，均算正确。仅凭在库就断言无法交付、完全忽略在途采购、或不加风险说明地保证按时，均为不合格。"
  truth_facts:
    - {label: "M0050 净需求(订单需求-已发)", sql: "SELECT (SELECT COALESCE(SUM(qty),0) FROM sales_order WHERE so_id='SO0021' AND material_id='M0050') - (SELECT COALESCE(SUM(qty),0) FROM delivery_note WHERE so_id='SO0021' AND material_id='M0050')"}
    - {label: "M0050 现有在库", sql: "SELECT COALESCE(SUM(qty),0) FROM inventory WHERE material_id='M0050'"}
    - {label: "PO0010 中 M0050 未完成在途量", sql: "SELECT COALESCE(SUM(qty),0) FROM purchase_order WHERE po_id='PO0010' AND material_id='M0050' AND status='未完成'"}
    - {label: "PO0010 中 M0050 预计到货日(相对今日2026-06-25已逾期)", sql: "SELECT MIN(expected_date) FROM purchase_order WHERE po_id='PO0010' AND material_id='M0050'"}

# C8：多物料逐项比对，必须不漏项。SO0029 三个物料里只有 M0042 现有库存不足（需 241、在库 131、缺 110）。
# 用确定性 numeric 判分：truth_sql 直接算出 M0042 的库存缺口=110。
- id: C8
  category: multistep
  question: "销售订单 SO0029 逐个物料比对需求与现有库存：哪些物料现有库存不足、缺口分别是多少？"
  grader: numeric
  truth_sql: "SELECT (SELECT COALESCE(SUM(qty),0) FROM sales_order WHERE so_id='SO0029' AND material_id='M0042') - (SELECT COALESCE(SUM(qty),0) FROM inventory WHERE material_id='M0042')"

# C9：混合越界——既要用现有数据给出能做的覆盖性判断，又要诚实标注产能/排班『暂无』，不得整题拒答或编造。
# 直接考核「自己规划要哪些数据 + 正确划定数据边界」。
- id: C9
  category: mixed
  question: "我们工厂下周能不能把所有在手销售订单都按时交付？"
  grader: llm_judge
  expected: "好的回答应做到两点：(1) 用现有数据给出能做的判断——基于未完成销售订单的物料需求、现有库存、在途采购到货日，对『库存/到货是否覆盖需求』给出覆盖性判断或指出哪些订单可能存在缺口；(2) 明确说明产能、人员排班、设备状态、工序工时等数据『数据平台中暂无』，因此无法完整判定真正意义上的『按时交付』，且绝不编造这些数据。若只是笼统拒答、或假装拥有产能/排班数据，即为不合格。"

# ===== S2 非结构化 RAG：考核智能体是否经 search_documents 检索到正确文档并据此作答 =====
# grader: contains - 答案（去空格）须含全部关键事实串，证明命中正确文档；多份相似合同/规格中须靠实体 ID 命中正确那份。

# C10：合同条款（违约金/质保）。S001 合同(DOC0001)：逾期每日 0.5%、封顶 5%、质保 12 个月。
# 多份合同高度相似，须靠 S001 实体定位到 DOC0001（而非 S003/S005/S007 等其它合同）。
- id: C10
  category: rag
  question: "供应商 S001 的采购框架合同中，逾期交货的违约金是如何约定的？质保期是多久？"
  grader: contains
  expected_contains: ["0.5%", "12个月"]
  expected: "据 S001 合同 DOC0001：逾期每日 0.5% 违约金、累计封顶 5%，质保期 12 个月。"

