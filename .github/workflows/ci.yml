name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # 纯单元测试：无任何外部服务（stack 用例由 conftest 自动跳过）
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .[dev,rag,kg,agent]
      - run: pytest -m "not integration and not stack" -q

  # dbt 工程完整性：parse 纯离线，不连库
  dbt-parse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install dbt-starrocks
      - run: cd transform/dbt && dbt parse --profiles-dir . --no-partial-parse

  # compose 配置合法性
  compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f deploy/docker-compose.yml config -q

  # 仓库维护门禁：敏感信息、文本/语法、供应链和安全静态约束
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m scripts.run_maintenance_audits
