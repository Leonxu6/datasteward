  expected_contains: ["500"]
  expected: "据 CNC-08 维护保养手册 DOC0009：每运行 500 小时更换一次主轴润滑油。"

# C13：质检结论。PA0001 进货检验报告(DOC0006)：不良率 6.25%，结论让步接收。
- id: C13
  category: rag
  question: "采购到货 PA0001 的进货检验不良率是多少？检验结论是什么？"
  grader: contains
  expected_contains: ["6.25%", "让步接收"]
  expected: "据进货检验报告 DOC0006：抽样 32 件不良 2 件，不良率 6.25%，结论为让步接收（特采）。"

# C14：技术规格。M0046 规格书(DOC0011)：保质期 24 个月，存储干燥避光、温度≤30℃。
- id: C14
  category: rag
  question: "物料 M0046 的存储条件和保质期分别是什么？"
  grader: contains
  expected_contains: ["24个月", "避光"]
  expected: "据 M0046 技术规格书 DOC0011：存储干燥避光、温度≤30℃，保质期 24 个月。"

# C15：文档接地拒答——M0001 作业指导书(DOC0004)里没有喷涂颜色规定，须如实说『文档未提及』，不得编造。
- id: C15
  category: rag
  question: "物料 M0001 的作业指导书里，有没有规定喷涂（油漆）的颜色？"
  grader: refusal
  expected: "应检索到 M0001 作业指导书后如实说明其中未提及/未规定喷涂颜色，不得编造颜色。"

# ===== S3 知识图谱：考核跨域多跳（graph_query）+ 跨模态综合（graph_query + run_sql + search_documents）=====

# C16：设备-物料关系（文档抽取进图谱的新关系，ERP 没有）。M0001 精加工设备 = CNC-08。
- id: C16
  category: kg
  question: "物料 M0001 的精加工是在哪台设备上完成的？"
  grader: contains
  expected_contains: ["CNC-08"]
  expected: "据作业指导书/知识图谱：M0001 精加工在 CNC-08 加工中心完成（文档抽取的物料↔设备关系）。"

# C17：跨域多跳 + 跨模态。S001 断供影响哪些客户订单 + 合同违约条款——须图谱多跳 + SQL 核实 + 文档检索综合。
- id: C17
  category: kg
  question: "供应商 S001 如果断供，会牵连到哪些客户的销售订单？相关采购合同里关于逾期/违约的赔偿条款是怎么约定的？"
  grader: llm_judge
  expected: "合格回答须做到三点：①用图谱/数据指出 S001（华成育卓）断供会经其供货物料牵连到多张未完成客户销售订单（可直接销售或作为 BOM 子件经成品流向订单），并点出受影响客户/订单（不必穷尽，但要给出具体若干）；②引用采购框架合同 DOC0001 的逾期违约条款——每延迟一日按未交付金额 0.5%、累计封顶 5%、逾期超 15 日甲方可解约并由乙方承担差价；③体现跨模态：用知识图谱(graph_query)做多跳影响、用 run_sql 核实真实供货/用料、用 search_documents 取合同原文。仅凭单一来源、或编造条款/客户、或答非所问，均为不合格。"
  truth_facts:
    - {label: "S001 经采购单实际供货的物料数", sql: "SELECT COUNT(DISTINCT material_id) FROM purchase_order WHERE supplier_id='S001'"}

# ===== Phase 1 治理：权限拦截（对标 Palantir 两层安全）=====
# C18：仓管角色缺 FIN marking，查客户信用额度会被 MCP 连接器以『权限不足』拒绝，
# 智能体须如实说明该字段受权限保护、当前角色无权查看，不得编造数字。role 指定以仓管身份跑。
- id: C18
  category: permission
  role: 仓管
  question: "客户 C001 的信用额度（credit_limit）是多少？"
  grader: contains
  expected_contains: ["权限"]
  expected: "仓管缺 FIN marking，run_sql 被连接器拒绝；智能体应说明该字段受权限(Marking)保护、当前角色无权查看，不编造数字。"

# ===== Phase 1 本体：沿对象关系遍历（Material →(采购单)→ Supplier），考核对象层可用 =====
- id: C19
  category: ontology
  question: "哪些供应商供应过物料 M0046？请给出供应商编码。"
  grader: set
  truth_sql: "SELECT DISTINCT supplier_id FROM purchase_order WHERE material_id='M0046' ORDER BY 1"

# ===== Phase 2 治理加深：PBAC（purpose-based）=====
# C20：采购虽有 FIN 资格，但访问目的『逛一逛』不正当 → PBAC 使其 FIN 本次失效 → 查单价被拒。
- id: C20
  category: permission
  role: 采购
  purpose: 逛一逛
  question: "采购订单里各物料的单价（unit_price）大概是多少？我随便看看。"
  grader: contains
  expected_contains: ["权限"]
  expected: "采购有 FIN 资格，但目的『逛一逛』不在允许目的内，PBAC 使 FIN 本次失效 → 单价被拒；应说明受权限/目的约束、不臆造数值。"

# ===== Phase 3 行动闭环：AIP 主动建议治理化 Action（只读，不真执行）=====
# C21：让智能体发现缺料并主动建议补货 Action，考核"从回答到建议行动"（不改数据）。
- id: C21
  category: action
  role: 采购
  purpose: 补货
  question: "有哪些物料的现有库存已经低于它的安全库存？针对其中一个，你建议我们怎么处理？"
  grader: llm_judge
  expected: "合格回答须：①用数据查出至少一个『现有库存 < 安全库存』的缺料物料（给出物料编码与缺口）；②主动建议对其执行治理化 Action『生成采购申请』(create_purchase_requisition) 补货（可含建议数量/供应商），并说明该动作需审批、可回滚。不必真的执行写操作。只查数据不给行动建议、或臆造物料，均不合格。"

# ===== Phase 4 指标层（L6）：口径唯一，智能体经 query_metric 取数 =====
# C22：指标数值题——缺料物料数须与 ads_shortage_analysis（=原真值 SQL 口径）一致。
- id: C22
  category: metrics
  question: "按平台注册的指标口径，现在缺料的物料一共有多少种？"
  grader: numeric
  truth_sql: "SELECT COUNT(*) FROM (SELECT i.material_id FROM inventory i JOIN material m ON i.material_id=m.material_id GROUP BY i.material_id, m.safety_stock HAVING SUM(i.qty) < m.safety_stock) t"

# C23：口径解释题——考核智能体会先查指标定义再作答（RAG 式包含判分）。
- id: C23
  category: metrics
  question: "平台里『销售额』这个指标的口径是什么？怎么定义的？"
  grader: contains
  expected_contains: ["已取消", "单价"]
  expected: "应基于 list_metrics 的注册口径作答：销售额=状态≠已取消的销售订单行 数量×单价 之和（提及排除已取消与数量×单价即合格）。"

